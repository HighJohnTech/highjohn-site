<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Roofing CRM validation gate</title><desc id="desc">A sold roofing job passes through validation before it is production ready.</desc><rect width="1200" height="630" fill="#090b19"/><g font-family="Arial,Helvetica,sans-serif"><text x="70" y="88" fill="#f2f4ff" font-size="34" font-weight="700">Roofing CRM validation gate</text><text x="70" y="125" fill="#9aa0b8" font-size="20">A stage change should prove readiness, not just record a click.</text><g transform="translate(70 230)"><rect width="230" height="115" rx="18" fill="#171b35" stroke="#00ced1"/><text x="115" y="50" text-anchor="middle" fill="#f2f4ff" font-size="25" font-weight="700">SOLD</text><text x="115" y="80" text-anchor="middle" fill="#9aa0b8" font-size="16">Agreement executed</text></g><path d="M310 288H430" stroke="#9aa0b8" stroke-width="4" marker-end="url(#a)"/><g transform="translate(440 190)"><rect width="320" height="195" rx="18" fill="#171b35" stroke="#d6ff4b" stroke-width="3"/><text x="160" y="45" text-anchor="middle" fill="#d6ff4b" font-size="24" font-weight="700">VALIDATE</text><text x="30" y="83" fill="#f2f4ff" font-size="17">✓ signed agreement</text><text x="30" y="113" fill="#f2f4ff" font-size="17">✓ measurements / photos</text><text x="30" y="143" fill="#f2f4ff" font-size="17">✓ material selection</text><text x="30" y="173" fill="#f2f4ff" font-size="17">✓ company prerequisites</text></g><path d="M770 288H890" stroke="#9aa0b8" stroke-width="4" marker-end="url(#a)"/><g transform="translate(900 230)"><rect width="230" height="115" rx="18" fill="#171b35" stroke="#00ced1"/><text x="115" y="48" text-anchor="middle" fill="#f2f4ff" font-size="23" font-weight="700">PRODUCTION READY</text><text x="115" y="82" text-anchor="middle" fill="#9aa0b8" font-size="16">Requirements passed</text></g><path d="M600 395V485H340" fill="none" stroke="#ffb547" stroke-width="4" marker-end="url(#b)"/><rect x="70" y="450" width="270" height="90" rx="18" fill="#171b35" stroke="#ffb547"/><text x="205" y="488" text-anchor="middle" fill="#f2f4ff" font-size="22" font-weight="700">FAIL / RETURN</text><text x="205" y="518" text-anchor="middle" fill="#9aa0b8" font-size="16">Owner + missing-item list</text><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#9aa0b8"/></marker><marker id="b" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#ffb547"/></marker></defs></g></svg>