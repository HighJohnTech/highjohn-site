<div class="share-row" aria-label="Share this article">
  <span class="mono share-label">Share</span>
  <a href="https://www.linkedin.com/sharing/share-offsite/?url={{ page.url | absolute_url | url_encode }}" target="_blank" rel="noopener noreferrer">LinkedIn</a>
  <a href="https://twitter.com/intent/tweet?url={{ page.url | absolute_url | url_encode }}&text={{ page.title | url_encode }}" target="_blank" rel="noopener noreferrer">X</a>
  <a href="https://www.facebook.com/sharer/sharer.php?u={{ page.url | absolute_url | url_encode }}" target="_blank" rel="noopener noreferrer">Facebook</a>
  <button type="button" onclick="navigator.clipboard && navigator.clipboard.writeText(window.location.href).then(()=>{this.textContent='Copied'; setTimeout(()=>this.textContent='Copy link',1600);})">Copy link</button>
</div>
